# Nombre de la aplicación
spring.application.name=XelleSystem
spring.datasource.url=jdbc:postgresql://localhost:5432/xelle_lims
spring.datasource.username=xelle_admin
spring.datasource.password=xelle_password_secure_123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate (El traductor Java <-> SQL)
# update: crea/modifica tablas automáticamente si cambias el código Java.
# validate: solo revisa (usar en producción). Para desarrollo usaremos 'update'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración del Servidor API
server.port=8080