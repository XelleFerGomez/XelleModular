version: '3.8'
services:
  db:
    image: postgres:13
    container_name: xelle_postgres
    environment:
      POSTGRES_USER: xelle_admin
      POSTGRES_PASSWORD: xelle_password_secure_123
      POSTGRES_DB: xelle_lims
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: xelle_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@xelle.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  postgres_data: