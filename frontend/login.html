<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Xelle System - Acceso</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#2FA583",      /* Verde Corporativo Exacto */
                "primary-hover": "#258569",
                "xelle-navy": "#1E3A5F",   /* Azul Navy Corporativo */
                "bg-light": "#F4F8F6",     /* Fondo suave */
              },
              fontFamily: { "display": ["Manrope", "sans-serif"] },
            },
          },
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.90); /* Un poco más opaco para seriedad */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(30, 58, 95, 0.15); /* Sombra basada en Navy */
        }
        body {
            background-color: #F4F8F6; /* bg-light */
        }
    </style>
</head>
<body class="font-display min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
    
    <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] bg-xelle-navy/10 rounded-full blur-[150px] -z-10"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-primary/10 rounded-full blur-[150px] -z-10"></div>
    
    <div class="w-full max-w-[460px] relative z-10">
        <div class="flex flex-col items-center mb-10">
            <img src="assets/icono.svg" alt="Xelle Logo" class="w-16 h-16 object-contain mb-4 drop-shadow-sm">
            <h1 class="text-xelle-navy text-4xl font-extrabold tracking-tight leading-none">Xelle <span class="text-primary">System</span></h1>
            <p class="text-xelle-navy/70 text-sm font-bold tracking-wide mt-2 text-center">Sistema gestión integral laboratorio Xelle Scientific</p>
        </div>

        <div class="glass-card rounded-2xl p-8 md:p-10">
            <div class="mb-8">
                <h2 class="text-xelle-navy text-2xl font-bold mb-2">Bienvenido</h2>
                <p class="text-slate-500 text-sm font-medium">Ingrese sus credenciales para continuar</p>
            </div>

            <div id="loginError" class="hidden flex items-center gap-3 p-4 mb-6 bg-red-50 border-l-4 border-red-500 rounded-r-lg animate-pulse">
                <span class="material-symbols-outlined text-red-500">error</span>
                <p class="text-red-700 text-sm font-bold">Usuario o contraseña incorrectos</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div class="flex flex-col gap-2">
                    <label class="text-xelle-navy text-xs font-bold uppercase tracking-widest ml-1">Usuario</label>
                    <div class="relative group">
                        <input id="username" class="w-full h-12 pl-12 pr-4 bg-white border-2 border-slate-200 rounded-xl text-xelle-navy font-bold placeholder:text-slate-400 placeholder:font-medium focus:border-primary focus:ring-0 outline-none transition-all" placeholder="Ej. admin" type="text" required/>
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined">person</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-xelle-navy text-xs font-bold uppercase tracking-widest ml-1">Contraseña</label>
                    <div class="relative group">
                        <input id="password" class="w-full h-12 pl-12 pr-4 bg-white border-2 border-slate-200 rounded-xl text-xelle-navy font-bold placeholder:text-slate-400 placeholder:font-medium focus:border-primary focus:ring-0 outline-none transition-all" placeholder="••••••••" type="password" required/>
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined">lock</span>
                        </div>
                    </div>
                </div>

                <button class="w-full h-12 bg-xelle-navy hover:bg-[#152a45] text-white font-bold text-lg rounded-xl shadow-md transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 mt-8" type="submit">
                    <span>Iniciar Sesión</span>
                    <span class="material-symbols-outlined text-[20px]">login</span>
                </button>
            </form>
        </div>
        
        <p class="text-center text-slate-500 text-xs font-bold mt-8">
            © 2024 Xelle Scientific. Todos los derechos reservados.
        </p>
    </div>

    <script src="js/config-users.js"></script>
    <script src="js/core/auth.js"></script>
</body>
</html>
