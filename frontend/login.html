<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xelle System - Acceso Seguro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#2FA583",
                        "primary-hover": "#258569",
                        "xelle-navy": "#1E3A5F",
                        "bg-light": "#F4F8F6"
                    },
                    fontFamily: { "display": ["Manrope", "sans-serif"] },
                    animation: {
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg-light h-screen flex items-center justify-center relative overflow-hidden font-display selection:bg-primary/30">

    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary/20 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
        <div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-xelle-navy/20 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-blue-300/20 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
    </div>

    <div class="relative z-10 w-full max-w-md p-8">
        
        <div class="bg-white/80 backdrop-blur-xl border border-white/50 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-10 relative overflow-hidden">
            
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-xelle-navy via-primary to-xelle-navy"></div>

            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary/10 to-primary/5 mb-4 shadow-inner border border-primary/10">
                    <span class="material-symbols-outlined text-3xl text-primary">biotech</span>
                </div>
                <h1 class="text-2xl font-extrabold text-xelle-navy tracking-tight">Xelle System</h1>
                <p class="text-sm text-slate-500 font-medium mt-1">LIMS & Gestión de Producción</p>
            </div>

            <form id="loginForm" class="space-y-6">
                
                <div class="space-y-1 group">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1 group-focus-within:text-primary transition-colors">Usuario</label>
                    <div class="relative transition-all duration-300 transform group-focus-within:scale-[1.02]">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">person</span>
                        </div>
                        <input type="text" id="username" 
                            class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-xelle-navy font-bold placeholder-slate-400 focus:outline-none focus:bg-white focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all"
                            placeholder="Ej. Xelle_Fer">
                    </div>
                </div>

                <div class="space-y-1 group">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1 group-focus-within:text-primary transition-colors">Contraseña</label>
                    <div class="relative transition-all duration-300 transform group-focus-within:scale-[1.02]">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">lock</span>
                        </div>
                        <input type="password" id="password" 
                            class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-xelle-navy font-bold placeholder-slate-400 focus:outline-none focus:bg-white focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="btnSubmit"
                    class="w-full bg-xelle-navy hover:bg-[#152a45] text-white font-bold py-4 rounded-xl shadow-lg shadow-xelle-navy/20 transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl flex items-center justify-center gap-2 group">
                    <span>INICIAR SESIÓN</span>
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </button>

                <div id="manualLoginContainer" class="hidden text-center mt-4 animate-pulse">
                    <p class="text-xs text-green-600 font-bold mb-2">✅ Credenciales Correctas</p>
                    <a href="index.html" class="inline-flex items-center gap-2 px-6 py-3 bg-primary text-white font-bold rounded-lg shadow-md hover:bg-primary-hover transition-colors">
                        Clic aquí para entrar al Dashboard
                        <span class="material-symbols-outlined text-sm">open_in_new</span>
                    </a>
                </div>

            </form>

            <div class="mt-8 text-center">
                <p class="text-xs text-slate-400 font-medium">
                    © 2026 Xelle Scientific. V1.3.0 (Embedded)
                </p>
            </div>
        </div>
    </div>

    <script>
        window.SeedData = {
            users: [
                {
                    id: 1,
                    username: "Xelle_Fer",
                    pass: "123",
                    fullName: "Luis Fernando Gómez",
                    role: "super_admin",
                    moduleAccess: ["all"]
                },
                {
                    id: 2,
                    username: "calidad",
                    pass: "123",
                    fullName: "Gerente de Calidad",
                    role: "quality_manager",
                    moduleAccess: ["lab-calidad"]
                }
            ]
        };
        console.log("✅ Datos de usuario cargados internamente.");
    </script>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const userClean = document.getElementById('username').value.trim();
            const passClean = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnSubmit');
            const manualLink = document.getElementById('manualLoginContainer');
            
            const originalBtnContent = btn.innerHTML;

            // 1. Cargando...
            btn.innerHTML = '<span class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full mr-2"></span> Verificando...';
            btn.classList.add('opacity-80', 'cursor-wait');

            setTimeout(() => {
                // 2. Buscar Usuario (Usando los datos de arriba)
                const foundUser = window.SeedData.users.find(u => 
                    u.username === userClean && u.pass === passClean
                );

                if (foundUser) {
                    // --- ÉXITO ---
                    console.log("Acceso concedido:", foundUser.fullName);
                    
                    // Guardar sesión
                    localStorage.setItem('xelle_user', JSON.stringify(foundUser));
                    
                    // Cambiar botón a verde
                    btn.classList.remove('bg-xelle-navy', 'hover:bg-[#152a45]');
                    btn.classList.add('bg-primary');
                    btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> ¡Bienvenido!';

                    // INTENTO 1: Redirección Automática
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);

                    // PLAN B: Botón manual (Aparece si falla la redirección automática)
                    setTimeout(() => {
                        manualLink.classList.remove('hidden');
                        btn.style.display = 'none'; 
                    }, 1500);

                } else {
                    // --- ERROR ---
                    alert("❌ Usuario o contraseña incorrectos.");
                    btn.innerHTML = originalBtnContent;
                    btn.classList.remove('bg-primary', 'opacity-80', 'cursor-wait');
                    btn.classList.add('bg-xelle-navy');
                }
            }, 600);
        });
    </script>
</body>
</html>
